<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별촘 BIOCHOM - 자른 넙적당면</title>
    <!-- 고급스러운 프리텐다드 웹 폰트 적용 -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --primary-green: #375344;
            --accent-gold: #C5A87C;
            --bg-cream: #FDFBF7;
            --text-dark: #222222;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f2f2f2;
            /* 바깥 배경은 회색으로 하여 상세페이지를 돋보이게 */
            color: var(--text-dark);
        }

        /* 쿠팡/스토어 상세페이지 규격에 맞춘 컨테이너 */
        .container {
            max-width: 860px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* 헤더 섹션 */
        .header {
            text-align: center;
            padding: 60px 20px 40px;
            background: linear-gradient(to bottom, #ffffff, var(--bg-cream));
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-green);
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.2;
            margin: 0 0 15px 0;
            color: var(--text-dark);
        }

        .subtitle {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--accent-gold);
        }

        /* 제품 이미지 및 패키지 텍스트 오버레이 */
        .product-image-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .product-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 패키지 빈 공간에 들어갈 텍스트 (절대 위치로 이미지 위에 띄움) */
        .package-text {
            position: absolute;
            bottom: 12%;
            /* 이미지의 하단 여백 위치에 맞춤 */
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 80%;
        }

        .pkg-subtitle {
            font-size: 1.3rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .pkg-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-green);
            margin-bottom: 4px;
            letter-spacing: -1px;
        }

        .pkg-feature {
            font-size: 1.1rem;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .pkg-weight {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-green);
        }

        /* 셀링 포인트 (마케팅 문구) 섹션 */
        .selling-point {
            background-color: var(--primary-green);
            color: white;
            padding: 80px 40px;
            text-align: center;
        }

        .highlight-text {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.5;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .highlight-text span {
            color: var(--accent-gold);
            display: block;
            margin-top: 10px;
            font-size: 2.6rem;
        }

        .desc-text {
            font-size: 1.2rem;
            line-height: 1.7;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 40px;
            font-weight: 400;
            word-break: keep-all;
        }

        /* 구매 버튼 */
        .buy-btn {
            display: inline-block;
            background-color: var(--accent-gold);
            color: white;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(197, 168, 124, 0.4);
        }

        .buy-btn:hover {
            transform: translateY(-5px);
            background-color: #b39566;
            box-shadow: 0 8px 20px rgba(197, 168, 124, 0.6);
        }

        /* 모바일 반응형 */
        @media (max-width: 600px) {
            .title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .pkg-subtitle {
                font-size: 1rem;
            }

            .pkg-title {
                font-size: 2rem;
            }

            .pkg-weight {
                font-size: 1.2rem;
            }

            .highlight-text {
                font-size: 1.6rem;
            }

            .highlight-text span {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 1. 헤더 (제품 인트로) -->
        <div class="header">
            <div class="brand">BIOCHOM</div>
            <h1 class="title">별촘 프리미엄 라인업</h1>
            <div class="subtitle">어떤 소스도 완벽하게 스며드는 마법</div>
        </div>

        <!-- 2. 푸주 패키지 (완벽한 비율의 HTML 오버레이 적용) -->
        <div class="product-image-container" style="margin-bottom: 80px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="font-size: 2rem; font-weight: 800; color: var(--primary-green);">01. 별촘 프리미엄 푸주</h2>
                <p style="color: #666;">AI 이미지가 아닌 완벽한 폰트 렌더링으로 상품성 극대화</p>
            </div>
            
            <div style="position: relative; width: 100%; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-radius: 12px; overflow: hidden;">
                <!-- 원본 푸주 이미지 -->
                <img src="file:///C:/Users/FAMILY/.gemini/antigravity-ide/brain/302d9834-068a-4b62-89c2-cfa726aa9d44/media__1783045883778.jpg" alt="푸주 원본" style="width: 100%; display: block;">
                
                <!-- 좌측 상단 기존 로고 가림막 (크림색 배경) -->
                <div style="position: absolute; top: 11%; left: 10%; width: 20%; height: 10%; background-color: #F1EFE6;"></div>
                
                <!-- 정중앙 황금비율 로고 배치 -->
                <div style="position: absolute; top: 16%; left: 50%; transform: translateX(-50%); text-align: center; width: 100%;">
                    <div style="font-size: 1.8rem; font-weight: 900; color: #2C4232; letter-spacing: -1px; line-height: 1.1;">별촘</div>
                    <div style="font-size: 1.1rem; font-weight: 700; color: #2C4232; letter-spacing: 2px;">BIOCHOM</div>
                </div>
            </div>
        </div>

        <!-- 3. 당면 패키지 (기존 작업본) -->
        <div class="product-image-container">
            <!-- 방금 생성한 무지 패키지(텍스트 없는 버전) 이미지 로드 -->
            <img src="C:/Users/FAMILY/.gemini/antigravity-ide/brain/302d9834-068a-4b62-89c2-cfa726aa9d44/biochom_v2_no_text_appetizing_food_1783044863365.png"
                alt="별촘 자른 넙적당면 패키지" class="product-image">

            <!-- 패키지 하단 빈 공간에 코드로 텍스트 삽입 -->
            <div class="package-text">
                <div class="pkg-subtitle">소스쫙~</div>
                <div class="pkg-title">넙적당면</div>
                <div class="pkg-feature">20cm 입안가득 채우는</div>
                <div class="pkg-weight">300g</div>
            </div>
        </div>

        <!-- 3. 핵심 마케팅 포인트 섹션 -->
        <div class="selling-point">
            <div class="highlight-text">
                떡볶이부터 마라탕, 찜닭까지!
                <span>어떤 소스도 완벽하게 스며드는<br>마법의 당면</span>
            </div>

            <p class="desc-text">
                오래 끓여도 쉽게 퍼지지 않고 마지막 한 입까지 쫄깃합니다.<br>
                별촘만의 특별한 배합으로 완성한 최상의 식감을 지금 바로 경험해보세요.
            </p>

            <a href="#buy" class="buy-btn">지금 바로 구매하기</a>
        </div>
    </div>

</body>

</html>
